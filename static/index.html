<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trendyol Ürün Asistanı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F7F7F7; color: #1A1A1A; min-height: 100vh; }

    header { background: white; border-bottom: 1px solid #EDEDED; padding: 0 2rem; display: flex; align-items: center; gap: 12px; height: 60px; }
    .logo { width: 36px; height: 36px; background: #FF6000; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .logo svg { width: 20px; height: 20px; fill: white; }
    header h1 { font-size: 17px; font-weight: 600; }
    header span { font-size: 11px; background: #FF6000; color: white; padding: 2px 8px; border-radius: 20px; font-weight: 600; }

    main { max-width: 680px; margin: 2rem auto; padding: 0 1rem; }

    .card { background: white; border-radius: 16px; border: 1px solid #EDEDED; padding: 1.5rem; margin-bottom: 1rem; }

    #upload-area { border: 2px dashed #DCDCDC; border-radius: 12px; padding: 2.5rem; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
    #upload-area:hover, #upload-area.drag { border-color: #FF6000; background: #FFF5F0; }
    #upload-area .icon { font-size: 40px; margin-bottom: 10px; }
    #upload-area p { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    #upload-area small { font-size: 12px; color: #888; }
    #file-input { display: none; }

    #preview-section { display: none; }
    .preview-grid { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 1rem; }
    #preview-img { width: 110px; height: 110px; object-fit: cover; border-radius: 10px; border: 1px solid #EDEDED; flex-shrink: 0; }
    .inputs { flex: 1; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; font-weight: 500; }
    input[type="text"] { width: 100%; padding: 9px 12px; border: 1px solid #DCDCDC; border-radius: 8px; font-size: 13px; font-family: inherit; outline: none; transition: border-color 0.15s; }
    input[type="text"]:focus { border-color: #FF6000; }

    .btn-primary { width: 100%; padding: 12px; background: #FF6000; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .btn-primary:hover { background: #E05500; }
    .btn-secondary { padding: 9px 16px; background: white; border: 1px solid #DCDCDC; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .btn-secondary:hover { background: #F7F7F7; }

    #loading-section { display: none; text-align: center; padding: 2.5rem; }
    .spinner { width: 36px; height: 36px; border: 3px solid #EDEDED; border-top-color: #FF6000; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { font-size: 13px; color: #888; }

    #result-section { display: none; }
    .result-block { margin-bottom: 1.25rem; }
    .result-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .result-label span { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.06em; }
    .copy-btn { font-size: 12px; padding: 4px 12px; background: white; border: 1px solid #DCDCDC; border-radius: 20px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .copy-btn:hover { border-color: #FF6000; color: #FF6000; }
    .copy-btn.copied { background: #F0FFF4; border-color: #22C55E; color: #22C55E; }
    #title-output { font-size: 16px; font-weight: 600; line-height: 1.5; color: #1A1A1A; }
    #desc-output { font-size: 13px; line-height: 1.8; color: #333; white-space: pre-wrap; }
    #keywords-container { display: flex; flex-wrap: wrap; gap: 6px; }
    .keyword-tag { background: #F7F7F7; border: 1px solid #EDEDED; border-radius: 20px; padding: 4px 12px; font-size: 12px; color: #555; }
    .divider { border: none; border-top: 1px solid #EDEDED; margin: 1.25rem 0; }
    .result-actions { display: flex; gap: 8px; }

    #error-msg { display: none; background: #FFF0F0; border: 1px solid #FFD0D0; border-radius: 10px; padding: 12px 16px; color: #CC3333; font-size: 13px; margin-top: 1rem; }

    footer { text-align: center; padding: 2rem; font-size: 12px; color: #AAA; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6" stroke="white" stroke-width="2" fill="none"/><path d="M16 10a4 4 0 01-8 0" stroke="white" stroke-width="2" fill="none"/></svg>
  </div>
  <h1>Trendyol Ürün Asistanı</h1>
  <span>AI</span>
</header>

<main>
  <div class="card">
    <div id="upload-area"
      onclick="document.getElementById('file-input').click()"
      ondragover="event.preventDefault(); this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')"
      ondrop="handleDrop(event)">
      <div class="icon">🛍️</div>
      <p>Ürün görselini buraya sürükle veya tıkla</p>
      <small>JPG, PNG, WEBP — max 10MB</small>
      <input type="file" id="file-input" accept="image/*" onchange="handleFile(this.files[0])">
    </div>

    <div id="preview-section">
      <div class="preview-grid">
        <img id="preview-img" alt="Ürün önizleme">
        <div class="inputs">
          <div>
            <label for="category">Kategori (isteğe bağlı)</label>
            <input type="text" id="category" placeholder="ör. Kadın Giyim, Elektronik...">
          </div>
          <div>
            <label for="extra">Ek bilgi (isteğe bağlı)</label>
            <input type="text" id="extra" placeholder="ör. Marka, malzeme, renk...">
          </div>
        </div>
      </div>
      <button class="btn-primary" onclick="generate()">✨ İçerik Oluştur</button>
    </div>
  </div>

  <div class="card" id="loading-section">
    <div class="spinner"></div>
    <p id="loading-text">Görsel analiz ediliyor...</p>
  </div>

  <div class="card" id="result-section">
    <div class="result-block">
      <div class="result-label">
        <span>Ürün Başlığı</span>
        <button class="copy-btn" onclick="copyField('title-output', this)">Kopyala</button>
      </div>
      <p id="title-output"></p>
    </div>
    <hr class="divider">
    <div class="result-block">
      <div class="result-label">
        <span>Ürün Açıklaması</span>
        <button class="copy-btn" onclick="copyField('desc-output', this)">Kopyala</button>
      </div>
      <p id="desc-output"></p>
    </div>
    <hr class="divider">
    <div class="result-block">
      <div class="result-label">
        <span>Anahtar Kelimeler</span>
        <button class="copy-btn" onclick="copyKeywords(this)">Kopyala</button>
      </div>
      <div id="keywords-container"></div>
    </div>
    <hr class="divider">
    <div class="result-actions">
      <button class="btn-secondary" onclick="resetForm()">🔄 Yeni Ürün</button>
      <button class="btn-secondary" onclick="generate()">✨ Yeniden Oluştur</button>
    </div>
  </div>

  <div id="error-msg"></div>
</main>

<footer>Trendyol Ürün Asistanı &mdash; AI destekli içerik üretici</footer>

<script>
  let currentFile = null;
  const API_URL = "/api/generate";

  const loadingMessages = [
    "Görsel analiz ediliyor...",
    "Ürün özellikleri tespit ediliyor...",
    "SEO anahtar kelimeleri belirleniyor...",
    "Trendyol formatı oluşturuluyor..."
  ];

  function handleDrop(e) {
    e.preventDefault();
    document.getElementById('upload-area').classList.remove('drag');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) handleFile(file);
  }

  function handleFile(file) {
    if (!file) return;
    currentFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('preview-img').src = e.target.result;
      document.getElementById('upload-area').style.display = 'none';
      document.getElementById('preview-section').style.display = 'block';
      document.getElementById('result-section').style.display = 'none';
      document.getElementById('error-msg').style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  async function generate() {
    if (!currentFile) return;
    document.getElementById('preview-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'none';
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('loading-section').style.display = 'block';

    let msgIdx = 0;
    const interval = setInterval(() => {
      document.getElementById('loading-text').textContent = loadingMessages[++msgIdx % loadingMessages.length];
    }, 1500);

    const formData = new FormData();
    formData.append('image', currentFile);
    formData.append('category', document.getElementById('category').value);
    formData.append('extra', document.getElementById('extra').value);

    try {
      const res = await fetch(API_URL, { method: 'POST', body: formData });
      const data = await res.json();
      clearInterval(interval);

      if (!res.ok) throw new Error(data.detail || 'Sunucu hatası');

      document.getElementById('title-output').textContent = data.title || '';
      document.getElementById('desc-output').textContent = data.description || '';

      const kwContainer = document.getElementById('keywords-container');
      kwContainer.innerHTML = '';
      (data.keywords || []).forEach(kw => {
        const tag = document.createElement('span');
        tag.className = 'keyword-tag';
        tag.textContent = kw;
        kwContainer.appendChild(tag);
      });

      document.getElementById('loading-section').style.display = 'none';
      document.getElementById('result-section').style.display = 'block';
    } catch (err) {
      clearInterval(interval);
      document.getElementById('loading-section').style.display = 'none';
      document.getElementById('preview-section').style.display = 'block';
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('error-msg').textContent = '❌ ' + err.message;
    }
  }

  function copyField(id, btn) {
    navigator.clipboard.writeText(document.getElementById(id).textContent).then(() => {
      btn.textContent = '✓ Kopyalandı';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Kopyala'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function copyKeywords(btn) {
    const tags = document.querySelectorAll('.keyword-tag');
    const text = Array.from(tags).map(t => t.textContent).join(', ');
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '✓ Kopyalandı';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Kopyala'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function resetForm() {
    currentFile = null;
    document.getElementById('file-input').value = '';
    document.getElementById('category').value = '';
    document.getElementById('extra').value = '';
    document.getElementById('upload-area').style.display = 'block';
    document.getElementById('preview-section').style.display = 'none';
    document.getElementById('result-section').style.display = 'none';
    document.getElementById('error-msg').style.display = 'none';
  }
</script>
</body>
</html>
